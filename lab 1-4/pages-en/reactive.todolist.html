<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reactive Todo List</title>
  <link rel="stylesheet" href="/lab7-todolist/assets/css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/rxjs@7.8.1/dist/bundles/rxjs.umd.min.js"></script>
  <script src="/lab7-todolist/assets/js/main.js" type="module"></script>
</head>

<body>
  <div class="container">
    <p class="work-label">LABORATORY WORK № 7</p>
    <h1> Todo List</h1>
    <a href="index.html" class="btn-back">Back to Main Page</a>

    <div class="todo-app">
      <div class="input-section">
        <h2>New Task</h2>
        <form id="todoForm" class="input-group">
          <input type="text" id="todoInput" placeholder="For example: Complete the lab work">
          <button id="addBtn" type="submit">Add</button>
        </form>

        <div id="filterButtons" class="filters">
          <button data-filter="all" class="active">All</button>
          <button data-filter="active">Active</button>
          <button data-filter="completed">Completed</button>
        </div>

        <div id="metaInfo" class="stats">
          Total: 0 | Active: 0 | Completed: 0
        </div>
      </div>

      <div class="list-section">
        <h2>Task List</h2>
        <ul id="todoList"></ul>
      </div>
    </div>
  </div>
</body>

</html>
